name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Download and Extract FFmpeg Shared Binaries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Copy-Item -Path "ffmpeg_extracted\*\bin\*.dll" -Destination "bin\" -Force
          Copy-Item -Path "ffmpeg_extracted\*\bin\ffmpeg.exe" -Destination "bin\" -Force
          Copy-Item -Path "ffmpeg_extracted\*\bin\ffprobe.exe" -Destination "bin\" -Force

      - name: Build Executable
        run: |
          pyinstaller --noconfirm EzthumbWin_CTk.spec

      - name: Archive Release
        shell: bash
        run: |
          cd dist/
          tar -czf ../EzthumbWin_CTk_Windows.tar.gz EzthumbWin_CTk/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: EzthumbWin_CTk_Windows.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
